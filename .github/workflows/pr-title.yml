name: Lint PR title

# Because PRs are squash-merged, the PR title becomes the commit message on
# master — and release-please parses those to version and build the changelog.
# This enforces that the title is a valid Conventional Commit before merge.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep this list in sync with the table in CLAUDE.md.
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
